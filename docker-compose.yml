# LOCAL DEVELOPMENT ONLY. The credentials below are public, dev-only defaults (also used by the
# test suite: postgres://postgres:postgres@localhost:5432/effinance_test). Never reuse them in any
# shared or production environment — production uses RDS with Secrets Manager (docs/deploy-aws.md).
services:
  db:
    # Pinned by tag + digest; bump both together. Stay on PostgreSQL 16 (same major as RDS,
    # docs/deploy-aws.md §3); keep the CI service image (.github/workflows/ci.yml) in sync.
    image: postgres:16.16-alpine3.24@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # dev only
      POSTGRES_DB: effinance
    ports:
      # Loopback only: the database is not reachable from the network.
      - '127.0.0.1:5432:5432'
    volumes:
      # Named volume (no host bind mount).
      - effinance-db:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  effinance-db:
