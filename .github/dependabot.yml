# Keeps the pins of the supply chain fresh: GitHub Actions SHAs, Docker base image digests and npm
# dependencies (pnpm lockfile). `cooldown` mirrors pnpm's minimumReleaseAge (pnpm-workspace.yaml):
# brand-new releases wait before being proposed. Security updates are not delayed by cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']

  # The API runs on Node 22 LTS and the local/CI database must match RDS (PostgreSQL 16): major
  # bumps are a planned migration, not a Dependabot PR. Ignoring them is what lets Dependabot propose
  # the 22.x / 16.x security patches (otherwise it only offers the newest major, e.g. Node 26, and
  # the runtime silently falls behind on security releases).
  - package-ecosystem: docker
    directories:
      - /apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      prod-dependencies:
        dependency-type: production
        update-types: [patch]
