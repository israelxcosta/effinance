# Windows installer (NSIS). Built by .github/workflows/desktop.yml on windows-2025; works on Linux too.
appId: br.com.efficio.effinance
productName: Effinance
copyright: Effinance
directories:
  output: release
  buildResources: build
# Only the bundled main/preload: every runtime dependency is inside dist/*.cjs.
files:
  - dist/**
  - package.json
extraResources:
  # The web app (API + database in the page), served by the app:// protocol.
  - from: ../web/dist-desktop
    to: renderer
    filter:
      - "**/*"
      - "!assets/pglite-*.data" # the build loads assets/pglite-fs.txt instead
asar: true
# Electron Fuses (flipped in the packaged Effinance.exe): the installed app cannot be run as plain
# Node (ELECTRON_RUN_AS_NODE), take NODE_OPTIONS or --inspect, nor load code outside app.asar, whose
# hash electron-builder embeds in the .exe and Electron checks at startup (Windows, Electron >= 30).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
npmRebuild: false
nodeGypRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Effinance
  installerLanguages: [pt_BR]
  language: "1046"
  artifactName: Effinance-Setup-${version}.exe
  # Uninstalling keeps the data and the backups (Documentos\Effinance\Backups).
  deleteAppDataOnUninstall: false
